name: vMeer Libfuse3 Android Build

on:
  workflow_dispatch:

jobs:
  build-fuse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python & Meson
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build
          pip3 install meson

      - name: Create Cross File for Android
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -1)
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          cat > android_cross.txt <<EOF
          [binaries]
          c = '$TOOLCHAIN/aarch64-linux-android24-clang'
          cpp = '$TOOLCHAIN/aarch64-linux-android24-clang++'
          ar = '$TOOLCHAIN/llvm-ar'
          strip = '$TOOLCHAIN/llvm-strip'
          pkgconfig = '/usr/bin/pkg-config'

          [properties]
          # Memaksa Meson menganggap library ini sudah ada di dalam libc (Bionic)
          # Ini akan mencegah error "library rt not found"
          sys_root = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot'
          
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'arm64-v8a'
          endian = 'little'
          EOF

      - name: Build Libfuse3
        run: |
          # 1. Buat Library 'rt' palsu agar Meson tidak komplain
          # Di Android, fungsi rt sudah ada di libc, jadi kita buat file .a kosong
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -1)
          SYSROOT="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android"
          
          # Kita buat file kosong bernama librt.a di folder build agar bisa di-link
          mkdir -p fake_libs
          ar rcs fake_libs/librt.a
          ar rcs fake_libs/libdl.a
          
          # 2. Patch Meson agar mencari library di folder fake_libs tersebut
          export LDFLAGS="-L$(pwd)/fake_libs"
          
          # Patch manual file meson.build untuk memaksa required : false
          sed -i "s/cc.find_library('rt', required : true)/cc.find_library('rt', required : false)/g" lib/meson.build
          sed -i "s/cc.find_library('dl', required : true)/cc.find_library('dl', required : false)/g" lib/meson.build
          
          # 3. Setup build dengan tambahan c_link_args untuk library palsu kita
          meson setup build-android \
            --cross-file android_cross.txt \
            --buildtype release \
            -Ddefault_library=static \
            -Dexamples=false \
            -Dtests=false \
            -Dutils=false \
            -Dc_link_args="-L$(pwd)/fake_libs" \
            -Dcpp_link_args="-L$(pwd)/fake_libs"

          # 3. Compile
          ninja -C build-android

      - name: Prepare Artifact
        run: |
          mkdir -p fuse-dist/libs/arm64-v8a
          mkdir -p fuse-dist/include
          # Cari file .a secara dinamis karena lokasi output meson bisa bervariasi
          find build-android -name "libfuse3.a" -exec cp {} fuse-dist/libs/arm64-v8a/ \;
          cp include/*.h fuse-dist/include/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfuse3-vmeer-arm64
          path: fuse-dist/
