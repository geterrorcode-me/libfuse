name: vMeer Libfuse3 Android Build

on:
  workflow_dispatch:

jobs:
  build-fuse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python & Meson
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build
          pip3 install meson

      - name: Create Cross File for Android
        run: |
          # Deteksi NDK secara otomatis
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -1)
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          cat > android_cross.txt <<EOF
          [binaries]
          c = '$TOOLCHAIN/aarch64-linux-android24-clang'
          cpp = '$TOOLCHAIN/aarch64-linux-android24-clang++'
          ar = '$TOOLCHAIN/llvm-ar'
          strip = '$TOOLCHAIN/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'arm64-v8a'
          endian = 'little'
          EOF

      - name: Build Libfuse3
        run: |
          # 1. Buat Fake Libs agar Meson tidak komplain soal library rt/dl yang hilang
          # Di Android, fungsi-fungsi ini sudah menyatu di libc.
          mkdir -p fake_libs
          ar rcs fake_libs/librt.a
          ar rcs fake_libs/libdl.a
          
          # 2. Patch Meson agar menganggap dependensi sistem opsional
          sed -i "s/cc.find_library('rt', required : true)/dependency('', required : false)/g" lib/meson.build
          sed -i "s/cc.find_library('dl', required : true)/dependency('', required : false)/g" lib/meson.build
          
          # 3. Setup Konfigurasi
          meson setup build-android \
            --cross-file android_cross.txt \
            --buildtype release \
            -Ddefault_library=static \
            -Dexamples=false \
            -Dtests=false \
            -Dutils=false \
            -Duseroot=false \
            -Dc_args="-D_GNU_SOURCE -D_FILE_OFFSET_BITS=64 -D_FORTIFY_SOURCE=2 -Wno-implicit-function-declaration" \
            -Dc_link_args="-L$(pwd)/fake_libs"

          # 4. KOMPILASI TARGET SPESIFIK (Hanya library utamanya saja)
          # Ini mencegah Ninja mencoba membangun modul multithreading yang rusak di Android
          ninja -C build-android lib/libfuse3.a

      - name: Prepare Artifact
        run: |
          mkdir -p fuse-dist/libs/arm64-v8a
          mkdir -p fuse-dist/include/fuse3
          
          # Verifikasi dan salin hasil build
          if [ -f build-android/lib/libfuse3.a ]; then
            cp build-android/lib/libfuse3.a fuse-dist/libs/arm64-v8a/
            echo "SUCCESS: libfuse3.a generated."
          else
            echo "Searching for results in subdirectories..."
            find build-android -name "libfuse3.a" -exec cp {} fuse-dist/libs/arm64-v8a/ \;
          fi

          # Cek final sebelum upload
          if [ ! -f fuse-dist/libs/arm64-v8a/libfuse3.a ]; then
             echo "CRITICAL: Build failed to produce libfuse3.a"
             exit 1
          fi
          
          # Ambil Header Files untuk JNI Bridge vMeer
          cp include/*.h fuse-dist/include/fuse3/
          find build-android -name "*.h" -exec cp {} fuse-dist/include/fuse3/ \; 2>/dev/null || true

      - name: Upload vMeer Fuse Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfuse3-vmeer-arm64
          path: fuse-dist/
