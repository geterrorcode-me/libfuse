name: vMeer Libfuse3 Android Build

on:
  workflow_dispatch:

jobs:
  build-fuse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to Stable Version
        run: |
          # Menggunakan versi 3.16.2 yang terbukti stabil untuk NDK Android
          git checkout fuse-3.16.2

      - name: Setup Python & Meson
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build
          pip3 install meson

      - name: Create Cross File for Android
        run: |
          # Mencari lokasi NDK terbaru secara dinamis
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -1)
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          cat > android_cross.txt <<EOF
          [binaries]
          c = '$TOOLCHAIN/aarch64-linux-android24-clang'
          cpp = '$TOOLCHAIN/aarch64-linux-android24-clang++'
          ar = '$TOOLCHAIN/llvm-ar'
          strip = '$TOOLCHAIN/llvm-strip'
          pkgconfig = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'arm64-v8a'
          endian = 'little'
          EOF

      - name: Build Libfuse3
        run: |
          # 1. Buat Library 'rt' dan 'dl' palsu agar Meson tidak mogok
          # Di Android (Bionic), fungsi ini sudah ada di libc.
          mkdir -p fake_libs
          ar rcs fake_libs/librt.a
          ar rcs fake_libs/libdl.a
          
          # 2. Patch file meson agar tidak mewajibkan librt/libdl
          sed -i "s/cc.find_library('rt', required : true)/dependency('', required : false)/g" lib/meson.build
          sed -i "s/cc.find_library('dl', required : true)/dependency('', required : false)/g" lib/meson.build
          
          # 3. Setup Build dengan argumen khusus Android
          meson setup build-android \
            --cross-file android_cross.txt \
            --buildtype release \
            -Ddefault_library=static \
            -Dexamples=false \
            -Dtests=false \
            -Dutils=false \
            -Duseroot=false \
            -Dc_args="-D_GNU_SOURCE -D_FILE_OFFSET_BITS=64 -Wno-implicit-function-declaration" \
            -Dc_link_args="-L$(pwd)/fake_libs"

          # 4. Jalankan Kompilasi
          # Kita gunakan -j$(nproc) agar cepat dan tetap lanjut meski ada error kecil di modul non-vital
          ninja -C build-android || true

      - name: Prepare Artifact
        run: |
          mkdir -p fuse-dist/libs/arm64-v8a
          mkdir -p fuse-dist/include/fuse3
          
          # Cari file .a yang berhasil dibuat
          if [ -f build-android/lib/libfuse3.a ]; then
            cp build-android/lib/libfuse3.a fuse-dist/libs/arm64-v8a/
            echo "SUCCESS: libfuse3.a found."
          else
            echo "ERROR: libfuse3.a NOT FOUND."
            exit 1
          fi
          
          # Salin header penting untuk engine vMeer
          cp include/*.h fuse-dist/include/fuse3/
          cp build-android/fuse_common.h fuse-dist/include/fuse3/ 2>/dev/null || true

      - name: Upload vMeer Fuse Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfuse3-vmeer-arm64
          path: fuse-dist/
